<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block">
<style>body{margin:0}b,strong{font-weight:600}a{color:#7B3FE4;text-decoration:none}a:hover{color:#FF5D5D}</style>
</helmet>
<div ref="{{ box }}" style="width:100%;font-family:'DM Sans',system-ui,sans-serif">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<header style="position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:22px max(clamp(16px,4vw,56px),calc((100vw - 1328px) / 2));color:#FFFFFF">
  <a href="Today-1d-Summit.dc.html" aria-label="Today" style="width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(12px)"><svg viewBox="0 0 512 512" width="26" height="26"><polyline points="90,356 190,256 264,312 338,238" fill="none" stroke="#FFFFFF" style="stroke-width:52;stroke-linecap:round;stroke-linejoin:round"></polyline><circle cx="398" cy="178" r="44" fill="#FFD27A"></circle></svg></a>
  <nav aria-label="Main" style="display:flex;gap:4px;margin-left:12px;padding:5px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);font-size:15px;font-weight:500">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
      <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><a href="{{ t.href }}" aria-current="page" style="padding:9px 18px;border-radius:999px;background:#FFFFFF;color:#2B0F4F">{{ t.long }}</a></sc-if>
      <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><a href="{{ t.href }}" style="padding:9px 16px;border-radius:999px;color:rgba(255,255,255,.85)" style-hover="background:rgba(255,255,255,.14);color:#FFFFFF">{{ t.long }}</a></sc-if>
    </sc-for>
  </nav>
  <div style="flex:1"></div>
  <a href="Scans-1d.dc.html" aria-label="Scans" style="width:46px;height:46px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#FFFFFF;display:grid;place-items:center" style-hover="background:rgba(255,255,255,.22)"><span class="material-symbols-rounded" style="font-size:22px">body_fat</span></a>
  <a href="AskAI-1d.dc.html" style="height:46px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,#FFD27A,#FF8A5B);color:#2B0F4F;font:500 15px 'DM Sans',system-ui;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(255,138,91,.4)"><span class="material-symbols-rounded" style="font-size:20px;font-variation-settings:'FILL' 1">auto_awesome</span>Ask AI</a>
  <a href="Settings-1d.dc.html" aria-label="Settings" style="width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;color:#2B0F4F;font:800 17px Outfit,system-ui" style-hover="background:#FFE3B5">A</a>
</header>
</sc-if>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
<header style="position:relative;display:flex;align-items:center;gap:10px;padding:14px 16px;color:#FFFFFF">
  <a href="Today-1d-Summit.dc.html" aria-label="Today" style="width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)"><svg viewBox="0 0 512 512" width="24" height="24"><polyline points="90,356 190,256 264,312 338,238" fill="none" stroke="#FFFFFF" style="stroke-width:52;stroke-linecap:round;stroke-linejoin:round"></polyline><circle cx="398" cy="178" r="44" fill="#FFD27A"></circle></svg></a>
  <div style="flex:1"></div>
  <a href="Scans-1d.dc.html" aria-label="Scans" style="width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#FFFFFF;display:grid;place-items:center"><span class="material-symbols-rounded" style="font-size:22px">body_fat</span></a>
  <a href="Settings-1d.dc.html" aria-label="Settings" style="width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;color:#2B0F4F;font:800 16px Outfit,system-ui">A</a>
</header>
<nav aria-label="Main" style="position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:50;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;border-radius:24px;background:rgba(31,16,51,.94);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(26,10,51,.45)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
    <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><a href="{{ t.href }}" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:18px;background:#FFFFFF;color:#2B0F4F;font:500 10px 'DM Sans',system-ui"><span class="material-symbols-rounded" style="font-size:22px;font-variation-settings:'FILL' 1">{{ t.icon }}</span>{{ t.short }}</a></sc-if>
    <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><a href="{{ t.href }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:18px;color:rgba(255,255,255,.78);font:400 10px 'DM Sans',system-ui"><span class="material-symbols-rounded" style="font-size:22px">{{ t.icon }}</span>{{ t.short }}</a></sc-if>
  </sc-for>
</nav>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;today&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;dashboard&quot;,&quot;log&quot;,&quot;train&quot;,&quot;progress&quot;,&quot;ai&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;'today'|'dashboard'|'log'|'train'|'progress'|'ai'|'none'&quot;,&quot;section&quot;:&quot;Navigation&quot;}}">
class Component extends DCLogic {
  box = React.createRef();
  state = { w: 1440 };
  componentDidMount() {
    let tries = 0;
    const watch = () => {
      const el = this.box.current;
      if (!el) { if (tries++ < 200) this.wt = setTimeout(watch, 25); return; }
      const read = () => { const r = this.box.current; if (!r) return; const w = Math.round(r.getBoundingClientRect().width); if (w && w !== this.state.w) this.setState({ w }); };
      read();
      if (window.ResizeObserver) { this.ro = new ResizeObserver(read); this.ro.observe(el); this.ro.observe(document.body); this.obs = el; }
      this.onResize = read; window.addEventListener('resize', read);
    };
    watch();
  }
  componentDidUpdate() {
    const r = this.box.current;
    if (this.ro && r && r !== this.obs) { this.ro.observe(r); this.obs = r; if (this.onResize) this.onResize(); }
    const narrow = this.state.w < 960;
    document.body.style.paddingBottom = narrow ? 'calc(84px + env(safe-area-inset-bottom, 0px))' : '';
    document.body.style.background = '#FFF8EE';
  }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); clearTimeout(this.wt); if (this.onResize) window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const a = this.props.active ?? 'today';
    const wide = this.state.w >= 960;
    const T = [
      ['today', 'Today', 'Today', 'today', 'Today-1d-Summit.dc.html'],
      ['dashboard', 'Dashboard', 'Dashboard', 'space_dashboard', 'Dashboard-1d.dc.html'],
      ['log', 'Log', 'Log', 'restaurant', 'Log-1d.dc.html'],
      ['train', 'Train', 'Train', 'fitness_center', 'Train-1d.dc.html'],
      ['progress', 'Progress', 'Progress', 'insights', 'Progress-1d.dc.html'],
      ['ai', 'Ask AI', 'AI', 'auto_awesome', 'AskAI-1d.dc.html']
    ];
    return {
      box: this.box,
      wide, narrow: !wide,
      tabs: T.map(([k, long, short, icon, href]) => ({ long, short, icon, href, on: a === k, off: a !== k }))
    };
  }
}
</script>
</body>
</html>
