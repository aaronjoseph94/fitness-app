<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Owns: the app icon — 1d Summit deep-sky rounded square (#1A0A42 → #3E1A73 → #9A3A8E, top to bottom), the Summit mark: a white trend polyline and a gold sun. Source of every PNG here (see SOURCE.md); the Summit nav's logo tile draws the same mark. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0A42"/>
      <stop offset="0.51" stop-color="#3E1A73"/>
      <stop offset="1" stop-color="#9A3A8E"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <g>
    <polyline points="90,356 190,256 264,312 338,238" fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="398" cy="178" r="44" fill="#FFD27A"/>
  </g>
</svg>
