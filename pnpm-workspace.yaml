# Owns: workspace packages, the single pinned version of every shared dependency (catalog), and which deps may run install scripts.
packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

catalog:
  # Language and tooling (versions verified 2026-10-05; see docs/PROGRESS.md)
  typescript: ~6.0.3
  "@types/node": 22.20.5
  tsx: 4.23.15
  prettier: 3.9.9
  concurrently: 10.0.5
  vitest: 4.1.11
  "@playwright/test": 1.56.1
  # Shared
  zod: 4.6.5
  # Worker
  hono: 4.13.13
  "@hono/zod-validator": 0.9.1
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  jose: 6.2.12
  "@modelcontextprotocol/server": 2.3.0
  "@modelcontextprotocol/hono": 2.0.2
  "@cloudflare/workers-oauth-provider": 1.2.1
  "@block65/webcrypto-web-push": 2.0.0
  wrangler: 4.147.0
  "@cloudflare/workers-types": 5.20261005.1
  "@cloudflare/vitest-plugin": 1.3.6
  # Web
  react: 19.3.0
  react-dom: 19.3.0
  react-is: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.2
