# Owns: workspace packages, the single pinned version of every shared dependency (catalog), and which deps may run install scripts.
packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: true

catalog:
  # Versions verified 2026-10-05 (TS 7 / Node 24 LTS; Vitest 4 held for Cloudflare plugin — see docs/PROGRESS.md).
  typescript: 7.0.2
  "@types/node": 24.19.1
  tsx: 4.23.15
  prettier: 3.9.9
  concurrently: 10.0.5
  dependency-cruiser: 18.5.0
  vitest: 4.1.11
  "@playwright/test": 1.63.0
  # Shared
  zod: 4.6.5
  # Worker
  hono: 4.13.13
  "@hono/zod-validator": 0.9.1
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  jose: 6.2.12
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/hono": 2.0.2
  "@cloudflare/workers-oauth-provider": 1.2.1
  "@block65/webcrypto-web-push": 2.0.0
  wrangler: 4.147.0
  "@cloudflare/workers-types": 5.20261005.1
  "@cloudflare/vitest-plugin": 1.3.6
  # Web
  react: 19.3.0
  react-dom: 19.3.0
  react-is: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.2
  "@vitejs/plugin-react": 6.1.2
  "@mui/material": 9.4.0
  "@mui/icons-material": 9.4.0
  "@emotion/react": 11.14.0
  "@emotion/styled": 11.14.1
  recharts: 3.10.1
  "@tanstack/react-query": 5.104.1
  zustand: 5.0.15
  dexie: 4.4.6
  dexie-react-hooks: 4.4.0
  react-router: 8.4.0
  vite-plugin-pwa: 2.0.0
  workbox-core: 7.4.1
  workbox-precaching: 7.4.1
  workbox-routing: 7.4.1
  workbox-strategies: 7.4.1
  workbox-expiration: 7.4.1
  "@fontsource-variable/geist": 5.3.0
  barcode-detector: 3.2.2
  pdfjs-dist: 6.4.299
  client-zip: 2.5.1
  fflate: 0.8.3
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2

# dependency-cruiser needs the TypeScript compiler API to read .ts sources, which TypeScript 7 (Go-native) doesn't
# publish yet. It gets its own TypeScript 6 copy; everything else compiles with the catalog's TypeScript 7.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

# drizzle-kit's loader pins esbuild 0.18, which carries GHSA-67mh-4wv8-2f99 (dev server reads any request). Dev-only,
# but the patched line is a drop-in for the loader.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261005.1"
  - "@modelcontextprotocol/core@2.3.1"
  - "@modelcontextprotocol/server@2.3.1"
  - "@vitejs/plugin-react@6.1.2"
